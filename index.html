<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZERO SECTOR</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap');

:root {
  --bg:            #000000;
  --text-light:    #fcfee6;
  --text-muted:    #616356;
  --accent-red:    #4f0000;
  --border:        #4f0000;
  --panel-bg:      rgba(0,0,0,0.88);
  --glow:          rgba(79,0,0,0.35);
  --scanline:      rgba(79,0,0,0.08);
}

html, body, #info-panel, h2, .description, .meta-line {
  font-family: 'IBM Plex Mono', monospace;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text-light);
  overflow: hidden;
  image-rendering: pixelated;
}
#app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 2.2vh 2.8vw;
  box-sizing: border-box;
  position: relative;
  background: var(--bg);
}
/* scanlines */
#app::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0 2px,
    var(--scanline) 2px,
    var(--scanline) 4px
  );
  z-index: 5;
  animation: scan 80s linear infinite;
  opacity: 0.7;
}
@keyframes scan {
  to { background-position: 0 120px; }
}
#content {
  flex: 1;
  display: flex;
  gap: 2.2vw;
  min-height: 0;
  position: relative;
  z-index: 3;
}
/* vignette ТОЛЬКО на карту */
#map-container {
  flex: 75;
  position: relative;
  background: var(--panel-bg);
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: inset 0 0 50px var(--glow);
}
#map-wrapper {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
#map-wrapper svg {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  filter: brightness(0.95) contrast(1.1) sepia(0.03) hue-rotate(10deg);
}
#map-container::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at 50% 50%, transparent 45%, var(--bg) 88%);
  z-index: 3;
}
/* лёгкий оверлей на карту */
#map-container::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(79,0,0,0.05) 0%, rgba(79,0,0,0.08) 100%);
  pointer-events: none;
  mix-blend-mode: multiply;
  z-index: 2;
}
/* Инфо-панель */
#info-panel {
  flex: 25;
  background: var(--panel-bg);
  border: 2px solid var(--border);
  box-shadow: 0 0 28px var(--glow);
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: border-color 0.4s, box-shadow 0.6s;
  color: var(--text-light);
}
#info-content {
  visibility: hidden;
  height: 0;
  overflow: hidden;
  opacity: 0;
  transition: opacity 0.25s ease, visibility 0s linear 0.25s;
  display: flex;
  flex-direction: column;
  height: 100%;
}
#info-content.visible {
  visibility: visible;
  height: auto;
  opacity: 1;
  transition: opacity 0.25s ease, visibility 0s linear 0s;
}
.info-image-fixed {
  flex: 0 0 33.33%;
  background: rgba(0,0,0,0.8);
  border-bottom: 1px solid var(--border);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1vh 1vw;
}
.no-signal {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: repeating-linear-gradient(
    45deg,
    rgba(79,0,0,0.08),
    rgba(79,0,0,0.08) 10px,
    transparent 10px,
    transparent 20px
  );
  border: 2px solid var(--border);
  color: var(--text-muted);
  font-size: 1.35em;
  text-align: center;
  line-height: 1.3;
}
.no-signal small {
  font-size: 0.68em;
  color: var(--text-muted);
  margin-top: 0.5em;
}
/* Текстовая часть */
.info-text-fixed {
  flex: 1;
  display: none;
  padding: 1.4vh 1.6vw;
  overflow-y: auto;
  flex-direction: column;
  gap: 0.9em;
}
/* Пустая панель */
#info-panel:not(.has-selection) {
  border-color: var(--border);
  box-shadow: 0 0 16px rgba(79,0,0,0.15);
}
#info-panel.has-selection {
  border-color: var(--accent-red);
  box-shadow: 0 0 32px rgba(79,0,0,0.4), inset 0 0 40px rgba(79,0,0,0.15);
  animation: panel-pulse 6s ease-in-out infinite alternate;
}
@keyframes panel-pulse {
  0% { box-shadow: 0 0 24px rgba(79,0,0,0.3), inset 0 0 30px rgba(79,0,0,0.1); }
  100% { box-shadow: 0 0 50px rgba(79,0,0,0.6), inset 0 0 55px rgba(79,0,0,0.25); }
}
/* Placeholder */
#info-placeholder {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 1.3em;
  text-align: center;
  opacity: 0.75;
}
/* Скрываем placeholder при выборе */
#info-panel.has-selection #info-placeholder,
#info-panel.preview-active #info-placeholder {
  display: none !important;
}
.zone {
  fill: transparent;
  cursor: crosshair;
  transition: fill .25s, stroke .25s;
}
.zone.enabled:hover {
  fill: rgba(79,0,0,0.10);
  stroke: var(--accent-red);
  stroke-width: 2.4;
}
.zone.active {
  fill: rgba(79,0,0,0.30);
  stroke: var(--accent-red);
  stroke-width: 2.8;
  filter: drop-shadow(0 0 12px var(--glow)) drop-shadow(0 0 20px var(--accent-red));
}
/* Типографика */
h2 {
  color: var(--text-light);
  text-shadow: none;
  font-weight: 500;
  letter-spacing: 0.5px;
}
@keyframes title-flicker {
  0%, 92%, 94%, 96%, 100% { opacity: 1; text-shadow: 0 0 6px var(--accent-red); }
  93% { opacity: 0.92; text-shadow: 1px 0 var(--accent-red); }
  95% { opacity: 0.96; text-shadow: -1px 0 var(--accent-red); }
}
.meta-line strong,
.meta-line {
  color: var(--text-muted);
  text-shadow: none;
}
.description {
  flex: 1;
  overflow-y: auto;
  margin: 0.4em 0 0 0;
  padding-top: 0.8em;
  border-top: 1px solid var(--border);
  white-space: pre-wrap;
  font-size: 1.12em;
  color: var(--text-muted);
  line-height: 1.45;
}
#info-empty {
  color: var(--text-muted);
  font-size: 1.3em;
  text-align: center;
  margin: auto 0;
  opacity: 0.75;
}
/* Прелоадер */
#preloader {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-light);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 1.5rem;
  text-align: center;
  transition: opacity 0.7s ease-out;
  pointer-events: none;
}
#preloader.hidden {
  opacity: 0;
  pointer-events: none;
}
#preloader .status {
  margin: 1.2em 0 0.8em;
  font-size: 1.1em;
  letter-spacing: 1px;
  text-shadow: 0 0 6px var(--accent-red);
  min-height: 1.4em;
  position: relative;
  display: inline-block;
}
#preloader .progress {
  width: 380px;
  max-width: 80vw;
  height: 6px;
  background: rgba(0,0,0,0.8);
  border: 1px solid var(--border);
  overflow: hidden;
  margin-top: 1.5em;
}
#preloader .bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, var(--accent-red), #4f0000);
  transition: width 0.4s ease-out;
}
.scanline {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0 3px,
    var(--scanline) 3px,
    var(--scanline) 6px
  );
  animation: scan 60s linear infinite;
  opacity: 0.7;
}
/* Глитч (перекрашен в новую палитру) */
.glitch {
  position: relative;
  display: inline-block;
  animation: glitch-mono 1.2s infinite steps(2);
}
.glitch::before,
.glitch::after {
  content: attr(data-text);
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0.8;
}
.glitch::before {
  left: 2px;
  text-shadow: -2px 0 var(--accent-red);
  clip: rect(0, 900px, 0, 0);
  animation: glitch-clip 3s infinite;
}
.glitch::after {
  left: -2px;
  text-shadow: 2px 0 var(--accent-red);
  clip: rect(0, 900px, 0, 0);
  animation: glitch-clip 2.5s infinite reverse;
}
@keyframes glitch-mono {
  0%, 5%, 100% { transform: translate(0); }
  2% { transform: translate(-1.5px, 0.5px); }
  4% { transform: translate(1.5px, -0.5px); }
}
@keyframes glitch-clip {
  0%    { clip: rect(42px, 9999px, 44px, 0); }
  5%    { clip: rect(17px, 9999px, 59px, 0); }
  10%   { clip: rect(63px, 9999px, 27px, 0); }
  100%  { clip: rect(68px, 9999px, 29px, 0); }
}
/* Глобальный glitch */
#app.glitch-global {
  animation: system-decay 0.7s steps(1);
  filter: brightness(0.9) contrast(1.1) sepia(0.05);
}
@keyframes system-decay {
  0%   { transform: translate(0); }
  20%  { transform: translate(3px, 1px); }
  40%  { transform: translate(-4px, -2px); }
  60%  { transform: translate(2px, 3px); }
  80%  { transform: translate(-2px, -1px); }
  100% { transform: translate(0); }
}
.glitch-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: 
    linear-gradient(transparent 50%, var(--scanline) 50%),
    repeating-linear-gradient(0deg, transparent, transparent 1px, var(--scanline) 1px, var(--scanline) 2px);
  mix-blend-mode: multiply;
  opacity: 0;
  animation: noise-pulse 8s infinite;
  z-index: 10;
}
#app.glitch-global .glitch-overlay {
  opacity: 0.5;
  animation: noise-pulse 1.2s steps(4), scanline 60s linear infinite;
}
@keyframes noise-pulse {
  0%, 100% { opacity: 0.5; }
  50%      { opacity: 0.8; }
}
/* Locked и ready зоны */
.zone.locked {
  pointer-events: none;
  fill: rgba(79,0,0,0.08) !important;
  stroke: rgba(79,0,0,0.3) !important;
  cursor: not-allowed;
}
.zone.ready:not(.opened) {
  fill: rgba(97,99,86,0.12);
  stroke: var(--accent-red);
  animation: pulse-ready 3s infinite alternate;
}
@keyframes pulse-ready {
  0% { stroke-opacity: 0.4; }
  100% { stroke-opacity: 0.7; }
}
.lock-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.7);
  color: var(--text-muted);
  font-size: 2.2em;
  text-align: center;
  z-index: 4;
  pointer-events: none;
  text-shadow: 0 0 8px var(--accent-red);
}
.lock-overlay .warning {
  font-size: 1.4em;
  color: var(--text-light);
  animation: flicker 4s infinite alternate;
}
.lock-overlay .status {
  margin-top: 0.5em;
  font-size: 0.9em;
  color: var(--text-muted);
}
/* Input и кнопки */
#password-input {
  display: none;
  margin: 1em auto;
  padding: 0.5em;
  background: rgba(0,0,0,0.8);
  border: 1px solid var(--border);
  color: var(--text-light);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 1.2em;
  text-align: center;
  width: 80%;
}
#password-submit {
  background: rgba(79,0,0,0.6);
  border: 1px solid var(--accent-red);
  color: var(--text-light);
  padding: 0.5em;
  margin-top: 0.5em;
  cursor: pointer;
}
#password-error {
  display: block !important;
  color: #a00000;
  font-size: 0.9em;
  margin-top: 0.5em;
}
#info-no-zones {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  font-size: 1.35em;
  text-align: center;
  line-height: 1.4;
  padding: 1em;
  opacity: 0.9;
}
#info-no-zones strong {
  color: var(--text-light);
  font-size: 1.1em;
}
#info-no-zones small {
  margin-top: 1em;
  font-size: 0.75em;
  color: var(--accent-red);
}
/* Flicker */
@keyframes flicker {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.4; }
}

/* Мобильные медиа-запросы (перекрашены) */
@media (max-width: 1024px) and (orientation: portrait) {
  #app, #content, body, html {
    overflow: hidden !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  #map-container {
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    overflow: hidden;
    position: relative;
    background: var(--bg);
  }
  #map-wrapper {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vh;
    height: 100vw;
    transform-origin: top left;
    transform: rotate(90deg) translateY(-100%);
    z-index: 1;
  }
  #map-wrapper svg {
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    display: block;
    object-fit: contain;
    position: relative;
    z-index: 1;
  }
  #info-panel,
  #app::before,
  #map-container::before,
  #map-container::after,
  #content > *:not(#map-container) {
    display: none !important;
  }
  .zone.enabled:hover {
    fill: rgba(79,0,0,0.12);
    stroke: var(--accent-red);
    stroke-width: 4;
  }
  .zone.active {
    fill: rgba(79,0,0,0.30);
    stroke: var(--accent-red);
    stroke-width: 5.5;
    filter: drop-shadow(0 0 10px var(--glow));
  }
  @keyframes pulseZone {
    0%, 100% { fill: transparent; stroke: rgba(79,0,0,0.6); stroke-width: 0; }
    50%      { fill: rgba(79,0,0,0.15); stroke: var(--accent-red); stroke-width: 3; }
  }
  .zone.enabled {
    animation: pulseZone 4.2s infinite ease-in-out;
  }
  .zone.enabled[data-zone="1"] { animation-delay: 0s; }
  .zone.enabled[data-zone="2"] { animation-delay: 0.7s; }
  .zone.enabled[data-zone="3"] { animation-delay: 1.4s; }
  .zone.enabled[data-zone="4"] { animation-delay: 2.1s; }
  .zone.enabled[data-zone="5"] { animation-delay: 2.8s; }
  .zone.enabled[data-zone="6"] { animation-delay: 3.5s; }
  #map-container.touched .zone.enabled {
    animation: none !important;
  }
  #map-container.touched .zone.active {
    fill: rgba(79,0,0,0.30) !important;
    stroke: var(--accent-red) !important;
    stroke-width: 5.5 !important;
    filter: drop-shadow(0 0 10px var(--glow)) !important;
  }
  .zone-modal {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    border: none;
    background: transparent;
    color: var(--text-light);
    font-family: 'IBM Plex Mono', monospace;
  }
  .zone-modal::backdrop {
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(6px);
  }
  .modal-content {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--panel-bg);
    border: 2px solid var(--border);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    justify-content: center;
    align-items: center;
  }
  .close-btn {
    position: absolute;
    top: 12px;
    right: 16px;
    background: transparent;
    border: none;
    color: var(--accent-red);
    font-size: 2.8rem;
    font-weight: bold;
    cursor: pointer;
    padding: 0 12px;
    line-height: 1;
    z-index: 10;
  }
  .close-btn:hover,
  .close-btn:focus {
    color: var(--text-light);
    text-shadow: 0 0 8px var(--accent-red);
  }
  .modal-image {
    flex: 0 0 40%;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-image img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border: 1px solid var(--border);
    box-shadow: 0 0 16px var(--glow);
  }
  .modal-text {
    flex: 1;
    padding: 20px 24px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    text-align: center;
  }
  .modal-text h2 {
    margin: 0 0 12px;
    font-size: 1.8rem;
    color: var(--text-light);
  }
  .meta {
    margin: 8px 0;
    font-size: 1.1rem;
    color: var(--text-muted);
  }
  .modal-text p {
    margin: 16px 0 0;
    line-height: 1.5;
    font-size: 1.05rem;
    color: var(--text-muted);
    white-space: pre-wrap;
  }
  .zone-modal[open] .modal-content {
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }
  .modal-password {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-top: 1em;
    width: 80%;
  }
  .modal-password input {
    background: rgba(0,0,0,0.8);
    border: 1px solid var(--border);
    color: var(--text-light);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.2em;
    text-align: center;
    width: 100%;
    padding: 0.5em;
  }
  .modal-password button {
    background: rgba(79,0,0,0.6);
    border: 1px solid var(--accent-red);
    color: var(--text-light);
    padding: 0.5em 1em;
    margin-top: 0.5em;
  }
  .modal-password .error {
    color: #a00000;
    font-size: 0.9em;
    margin-top: 0.5em;
  }
}
 
/* Ландшафт на мобильных */
@media (max-width: 1024px) and (orientation: landscape) {
  #map-container {
    width: 100%;
    height: 100%;
  }
  #map-wrapper {
    transform: none;
  }
  #map-wrapper svg {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  #info-panel {
    display: none;
  }
}
</style>
</head>
<body>

  <div class="scanline"></div>
  <div>ИНИЦИАЛИЗАЦИЯ СИГНАЛА...</div>
<div class="status glitch" id="preload-status" data-text="Поиск носителя данных">Поиск носителя данных</div>
  <div class="progress">
    <div class="bar" id="preload-bar"></div>
  </div>
</div>
  
<div id="app">
  <div id="content">
    <div id="map-container">
      <div id="map-wrapper">
        <svg viewBox="0 0 2048 1360" preserveAspectRatio="xMidYMid meet">
          <image href="assets/maps/open_0_6.png" width="2048" height="1360"></image>

<script>
// Глобальные переменные
let activeZone = null;
let typingTimer = null;

// Пароли для зон
const passwords = ['O0YJ7T', 'HR8JCF', 'FUW80C', '4V452B', 'J8EXGM', 'PJZT3D'];

// Даты активации
const activationDates = [
  new Date('2026-02-09T09:00:00Z'),
  new Date('2026-02-10T09:00:00Z'),
  new Date('2026-02-11T09:00:00Z'),

// Обновление карты
function updateMap() {
  const openedCount = openedZones.length;
  let mapPath = `assets/maps/open_${openedCount}_6.png`;
  let mapV2Path = `assets/maps/open_${openedCount}_6_v2.png`;
  if (openedCount === 0) {

    mapV2Path = 'assets/maps/open_0_6_v2.png';
  }
  const imageEl = document.querySelector('#map-wrapper image');
  if (imageEl) {
    imageEl.setAttribute('href', mapPath);
    if (window.matchMedia("(max-width: 1024px) and (orientation: portrait)").matches) {
      imageEl.setAttribute('href', mapV2Path);
    }
    console.log(`Карта обновлена: ${imageEl.getAttribute('href')} | Открыто зон: ${openedZones.length}`);
  }
}

// Заглушка для 0 открытых зон

  const noZonesEl = document.getElementById('info-no-zones');
  const placeholder = document.getElementById('info-placeholder');
  const passwordInputVisible = document.getElementById('password-input').style.display === 'block' ||
                               document.querySelector('.modal-password')?.style.display === 'flex';

  if (openedZones.length === 0 && !activeZone && !passwordInputVisible && readyStage === 0) {
    placeholder.style.display = 'none';
    document.getElementById('info-image-fixed').style.display = 'none';
    document.getElementById('info-text-fixed').style.display = 'none';
    noZonesEl.style.display = 'flex';
  } else {
    noZonesEl.style.display = 'none';
    if (!activeZone && !passwordInputVisible) {
      placeholder.innerHTML = 'Выберите сектор на карте'; // Сброс оригинального текста
      placeholder.style.display = 'flex';
      document.getElementById('info-image-fixed').style.display = 'none';
      document.getElementById('info-text-fixed').style.display = 'none';
    } else {
      placeholder.style.display = 'none';
    }
  }
}

// Инициализация
updateMap();
updateNoZonesPlaceholder();

const data = {

    desc: "Лаборатория не числится ни в одном актуальном реестре, но продолжает физически присутствовать в структуре. Здесь использовались старые протоколы, экспериментальные среды, которые позже были запрещены или «утеряны». Большая часть данных либо уничтожена, либо намеренно повреждена. \nИменно здесь впервые зафиксированы несанкционированные изменения среды, которые позже были списаны на «ошибки сборки мегаструктуры».",

    image: "assets/info/image_6.png"
  }
};

// typeText
function typeText(el, text) {
  el.textContent = "";
  let i = 0;
  clearInterval(typingTimer);
  typingTimer = setInterval(() => {
    if (i < text.length) {
      el.textContent += text[i++];
    } else {
      clearInterval(typingTimer);
      typingTimer = null;
    }
  }, 38);
}

// showInfo
function showInfo(zoneId, isHover = false) {
  hidePasswordPrompts();
  const d = data[zoneId];
  if (!d) return;
  document.getElementById('i-title').textContent = d.title;
  document.getElementById('i-class').textContent = d.class;
  document.getElementById('i-status').textContent = d.status;
  document.getElementById('i-desc').textContent = '';
  typeText(document.getElementById('i-desc'), d.desc);
  const imageBlock = document.getElementById('info-image-fixed');
  imageBlock.innerHTML = '';
  const img = document.createElement('img');
  img.src = d.image || 'assets/info/placeholder.png';
  img.alt = d.title;
  img.style.width = '100%';
  img.style.height = '100%';
  img.style.objectFit = 'cover';
  img.style.border = '2px solid #600';
  imageBlock.appendChild(img);
  document.getElementById('info-placeholder').style.display = 'none';
  document.getElementById('info-image-fixed').style.display = 'flex';
  document.getElementById('info-text-fixed').style.display = 'flex';
  if (isHover) {
    document.getElementById('info-panel').classList.add('preview-active');
  } else {
    document.getElementById('info-panel').classList.add('has-selection');
  }
}

// clearInfo
function clearInfo(isHover = false) {
  clearInterval(typingTimer);
  typingTimer = null;
  document.getElementById('i-title').textContent = '';
  document.getElementById('i-class').textContent = '';
  document.getElementById('i-status').textContent = '';
  document.getElementById('i-desc').textContent = '';
  const imageBlock = document.getElementById('info-image-fixed');
  imageBlock.innerHTML = `
    <div class="no-signal">
      NO SIGNAL
      <small>Изображение зоны<br>будет здесь</small>
    </div>
  `;
  document.getElementById('info-image-fixed').style.display = 'none';
  document.getElementById('info-text-fixed').style.display = 'none';
  const placeholder = document.getElementById('info-placeholder');
  placeholder.innerHTML = 'Выберите зону на карте'; // Сброс текста
  placeholder.style.display = 'flex';
  if (isHover) {
    document.getElementById('info-panel').classList.remove('preview-active');
  } else {
    document.getElementById('info-panel').classList.remove('has-selection');
    activeZone?.classList.remove('active');
    activeZone = null;
  }
  hidePasswordPrompts();
  updateNoZonesPlaceholder();
}

// Модальное окно с информацией о зоне (для мобильного)
function openZoneModal(zoneId) {
  const modal = document.getElementById('zone-modal');
  if (!modal) return;

  const d = data[zoneId];
  if (!d) return;

  modal.innerHTML = `
    <div class="modal-content">
      <button class="close-btn" aria-label="Закрыть">×</button>
      
      <div class="modal-image">
        <img src="${d.image || 'assets/info/placeholder.png'}" alt="${d.title}">
      </div>
      
      <div class="modal-text">
        <h2>${d.title}</h2>
        <div class="meta"><strong>CLASS:</strong> ${d.class}</div>
        <div class="meta"><strong>STATUS:</strong> ${d.status}</div>
        <p style="white-space: pre-wrap; line-height: 1.5;">${d.desc}</p>
      </div>
    </div>
  `;

  modal.showModal();

  // Закрытие по крестику (на случай, если старый обработчик не сработал)
  modal.querySelector('.close-btn').onclick = () => modal.close();
}

document.querySelectorAll('.zone').forEach(z => {
  const zoneNum = +z.dataset.zone;

  // Классы зон
  if (zoneNum > readyStage) {
    z.classList.add('locked');
  } else if (openedZones.includes(zoneNum)) {
    z.classList.add('enabled', 'opened');
  } else {
    z.classList.add('ready');
  }

  z.addEventListener('click', () => {
    if (z.classList.contains('locked')) return;

    const zoneNum = +z.dataset.zone;
    const isMobilePortrait = window.matchMedia("(max-width: 1024px) and (orientation: portrait)").matches;

    // Повторный клик → снимаем выделение
    if (activeZone === z) {
      z.classList.remove('active');
      activeZone = null;
      clearInfo(false);
      return;
    }

    // Снимаем старую активную зону
    if (activeZone) {
      activeZone.classList.remove('active');
      clearInfo(false);
    }

    // Делаем текущую активной
    activeZone = z;
    z.classList.add('active');

    if (openedZones.includes(zoneNum)) {
      // Открытая зона → показываем информацию
      if (isMobilePortrait) {
        openZoneModal(zoneNum);          // ← используем новую функцию
      } else {
        showInfo(zoneNum, false);
      }
    } else if (z.classList.contains('ready')) {
      // Готова по дате
      if (isPreviousZonesOpened(zoneNum)) {
        // Можно активировать
        if (isMobilePortrait) {
          showMobilePasswordModal(zoneNum);  // ← из предыдущего сообщения
        } else {
          showPasswordPrompt(zoneNum);
        }
      } else {
        // Заблокирована последовательностью
        if (isMobilePortrait) {
          showMobileSequentialWarning(zoneNum);  // ← из предыдущего сообщения
        } else {
          showSequentialLockMessage(zoneNum);
        }
      }
    }
  });

  // Hover (только открытые зоны)
  z.addEventListener('mouseenter', () => {
    if (activeZone || !openedZones.includes(zoneNum)) return;
    showInfo(zoneNum, true);
  });

  z.addEventListener('mouseleave', () => {
    if (activeZone || !openedZones.includes(zoneNum)) return;
    clearInfo(true);
  });
});

// showPasswordPrompt
function showPasswordPrompt(zoneNum) {
  hidePasswordPrompts();
  document.getElementById('info-placeholder').style.display = 'none';
  document.getElementById('info-image-fixed').style.display = 'none';
  document.getElementById('info-text-fixed').style.display = 'none';
  document.getElementById('password-input').style.display = 'block';
  document.getElementById('password-submit').style.display = 'block';
  document.getElementById('password-error').textContent = '';
  document.getElementById('password-input').value = '';
  document.getElementById('password-input').placeholder = `КЛЮЧ ДЛЯ СЕКТОРА ${zoneNum}`;
  document.getElementById('password-input').focus();
  document.getElementById('password-submit').onclick = () => {
    const val = document.getElementById('password-input').value.trim().toUpperCase();
    if (val === passwords[zoneNum - 1]) {
      openZone(zoneNum);
    } else {
      document.getElementById('password-error').textContent = 'НЕВЕРНЫЙ КЛЮЧ. ПОВТОРИТЕ.';
    }
  };
}

// hidePasswordPrompts
function hidePasswordPrompts() {
  document.getElementById('password-input').style.display = 'none';
  document.getElementById('password-submit').style.display = 'none';
  document.getElementById('password-error').textContent = '';
}

// openZone
function openZone(zoneNum) {
  openedZones.push(zoneNum);
  openedZones.sort((a, b) => a - b);
  localStorage.setItem('openedZones', JSON.stringify(openedZones));
  const z = document.querySelector(`.zone[data-zone="${zoneNum}"]`);
  z.classList.remove('ready');
  z.classList.add('enabled', 'opened');
  hidePasswordPrompts();
  updateMap();
  showInfo(zoneNum, false);
}

// isPreviousZonesOpened
function isPreviousZonesOpened(zoneNum) {
  if (zoneNum <= 1) return true;
  for (let i = 1; i < zoneNum; i++) {
    if (!openedZones.includes(i)) return false;
  }
  return true;
}

// showSequentialLockMessage
function showSequentialLockMessage(zoneNum) {
  hidePasswordPrompts();
  document.getElementById('info-image-fixed').style.display = 'none';
  document.getElementById('info-text-fixed').style.display = 'none';
  const placeholder = document.getElementById('info-placeholder');
  placeholder.style.display = 'flex';
  placeholder.innerHTML = `
    <div style="color: #800; font-size: 1.3em; line-height: 1.4; text-align: center; padding: 1em;">
      СЕКТОР ${zoneNum} НЕДОСТУПЕН<br>
      ТРЕБУЕТСЯ ПОСЛЕДОВАТЕЛЬНАЯ АКТИВАЦИЯ<br><br>
      <small style="color: #600; font-size: 0.85em;">
        Необходимо открыть все предыдущие уровни
      </small>
    </div>
  `;
}

// Модалка с вводом пароля на мобильном
function showMobilePasswordModal(zoneNum) {
  const modal = document.getElementById('zone-modal');
  if (!modal) return;

  const modalContent = document.querySelector('.modal-content');
  modalContent.innerHTML = `
    <button class="close-btn" aria-label="Закрыть">×</button>
    <div style="padding: 1.5em; text-align: center;">
      <h2 style="color: #e00;">АКТИВАЦИЯ ЗОНЫ ${zoneNum}</h2>
      <p style="color: #c00; margin: 1em 0;">Введите ключ</p>
      <input type="text" id="mobile-password-input" placeholder="КЛЮЧ (6 символов)" maxlength="6" style="width: 80%; padding: 0.8em; background: #200; border: 1px solid #600; color: #f00; font-family: 'IBM Plex Mono'; font-size: 1.2em; text-align: center;">
      <button id="mobile-password-submit" style="margin-top: 1em; background: #400; border: 1px solid #800; color: #f00; padding: 0.8em 1.5em; font-family: 'IBM Plex Mono'; cursor: pointer;">АКТИВИРОВАТЬ</button>
      <div id="mobile-password-error" style="color: #f00; font-size: 1em; margin-top: 0.8em; min-height: 1.5em;"></div>
    </div>
  `;

  modal.showModal();

  document.getElementById('mobile-password-submit').onclick = () => {
    const input = document.getElementById('mobile-password-input').value.trim().toUpperCase();
    const errorEl = document.getElementById('mobile-password-error');

    if (input === passwords[zoneNum - 1]) {
      errorEl.textContent = '';
      openZone(zoneNum);
      modal.close();
    } else {
      errorEl.textContent = 'НЕВЕРНЫЙ КЛЮЧ';
    }
  };

  // Закрытие по крестику
  modal.querySelector('.close-btn').onclick = () => modal.close();
}

// Модалка с предупреждением о последовательности на мобильном
function showMobileSequentialWarning(zoneNum) {
  const modal = document.getElementById('zone-modal');
  if (!modal) return;

  modal.innerHTML = `
    <div class="modal-content" style="padding: 2em; text-align: center;">
      <button class="close-btn" aria-label="Закрыть">×</button>
      <h2 style="color: #e00;">ЗОНА ${zoneNum} ЗАБЛОКИРОВАНА</h2>
      <p style="color: #c00; font-size: 1.1em; margin: 1em 0;">
        Требуется последовательная активация предыдущих зон
      </p>
    </div>
  `;

  modal.showModal();

  modal.querySelectorAll('.close-btn, .close-btn-secondary').forEach(btn => {
    btn.onclick = () => modal.close();
  });
}

  });

  document.getElementById('zone-modal')?.addEventListener('click', e => {
    if (e.target === document.getElementById('zone-modal')) {
      document.getElementById('zone-modal').close();
    }
  });
});

// Прелоадер
document.addEventListener('DOMContentLoaded', () => {
  const preloader = document.getElementById('preloader');
  if (!preloader) return;
  const statusEl = document.getElementById('preload-status');
  const bar = document.getElementById('preload-bar');
  const minDuration = 5000;
  const startTime = Date.now();
  const messages = ["Поиск носителя данных...", "Обнаружен фрагмент карты сектора", "Проверка целостности слоёв...", "Калибровка координат зон...", "Синхронизация сигнатуры...", "Соединение установлено"];
  const delays = [800, 1200, 600, 1000, 500, 900];
  let msgIndex = 0;
  function nextMessage() {
    if (msgIndex < messages.length) {
      let msg = messages[msgIndex];
      if (Math.random() < 0.3) msg = msg.slice(0, -3) + msg.slice(-3).repeat(2) + '...';
      statusEl.textContent = msg;
      const progress = ((msgIndex + 1) / messages.length) * 100;
      bar.style.width = `${progress}%`;
      msgIndex++;
      setTimeout(nextMessage, delays[msgIndex - 1] || 700);
    }
  }
  nextMessage();
  function tryHide() {
    const elapsed = Date.now() - startTime;
    if (elapsed >= minDuration && msgIndex >= messages.length) {
      preloader.classList.add('hidden');
      setTimeout(() => {
        preloader.remove();
        startGlobalGlitches();
      }, 800);
    } else {
      setTimeout(tryHide, 200);
    }
  }
  const mainMapImage = document.querySelector('#map-wrapper image');
  if (mainMapImage?.complete && mainMapImage.naturalWidth > 0) {
    tryHide();
  } else if (mainMapImage) {
    mainMapImage.addEventListener('load', tryHide, { once: true });
    mainMapImage.addEventListener('error', tryHide, { once: true });
  } else {
    setTimeout(tryHide, minDuration);
  }
  setTimeout(() => preloader?.parentNode && preloader.remove(), 15000);
});

// Glitch
function startGlobalGlitches() {
  const app = document.getElementById('app');
  function triggerGlitch() {
    app.classList.add('glitch-global');
    setTimeout(() => app.classList.remove('glitch-global'), 700 + Math.random() * 500);
    if (Math.random() < 0.15) {
      app.style.filter = 'brightness(0.4) contrast(1.8)';
      setTimeout(() => app.style.filter = '', 400);
    }
    setTimeout(triggerGlitch, 12000 + Math.random() * 23000);
  }
  setTimeout(triggerGlitch, 5000 + Math.random() * 10000);
}
