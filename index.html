<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZERO SECTOR</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap');

html, body, #info-panel, h2, .description, .meta-line {
  font-family: 'IBM Plex Mono', monospace;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #c00;
  overflow: hidden;
  image-rendering: pixelated;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 2.2vh 2.8vw;
  box-sizing: border-box;
  position: relative;
  background: #000;                      /* убрали общий градиент с #app */
}

/* scanlines оставляем на весь экран (или можно тоже перенести на #map-container) */
#app::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0 2px,
    rgba(160,0,0,0.035) 2px,
    rgba(160,0,0,0.035) 4px
  );
  z-index: 5;
  animation: scan 80s linear infinite;
}

@keyframes scan {
  to { background-position: 0 120px; }
}

#content {
  flex: 1;
  display: flex;
  gap: 2.2vw;
  min-height: 0;
  position: relative;
  z-index: 3;
}

/* vignette ТОЛЬКО на карту */
#map-container {
  flex: 75;
  position: relative;
  background: rgba(6,0,0,0.78);
  border: 1px solid #400;
  overflow: hidden;
  box-shadow: inset 0 0 50px rgba(100,0,0,0.35);
  /* добавляем vignette */
}

#map-wrapper {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

#map-wrapper svg {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  filter: brightness(0.92) contrast(1.06) sepia(0.08) hue-rotate(350deg);
}

#map-container::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at 50% 50%, transparent 45%, #000 88%);
  z-index: 3;                            /* выше карты, но ниже оверлея если он есть */
}

/* лёгкий красный оверлей на карту (пункт 6) */
#map-container::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(180,0,0,0.07) 0%, rgba(100,0,0,0.12) 100%);
  pointer-events: none;
  mix-blend-mode: multiply;
  z-index: 2;
}  

/* Улучшаем поведение пустой панели */
#info-panel {
  flex: 25;
  background: rgba(4,0,0,0.94);
  border: 2px solid #500;
  box-shadow: 0 0 28px rgba(160,0,0,0.3);
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: border-color 0.4s, box-shadow 0.6s;
  color: #c33;
}

#info-content {
  visibility: hidden;
  height: 0;
  overflow: hidden;
  opacity: 0;
  transition: opacity 0.25s ease, visibility 0s linear 0.25s;
  display: flex;
  flex-direction: column;
  height: 100%;
}

#info-content.visible {
  visibility: visible;
  height: auto;
  opacity: 1;
  transition: opacity 0.25s ease, visibility 0s linear 0s;
}

.info-image-fixed {
  flex: 0 0 33.33%;               /* фиксированная доля высоты */
  background: rgba(10,0,0,0.7);
  border-bottom: 1px solid #500;
  display: none;                  /* скрыт по умолчанию */
  align-items: center;
  justify-content: center;
  padding: 1vh 1vw;
}

.no-signal {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: repeating-linear-gradient(
    45deg,
    rgba(200,0,0,0.12),
    rgba(200,0,0,0.12) 10px,
    transparent 10px,
    transparent 20px
  );
  border: 2px solid #600;
  color: #800;
  font-size: 1.35em;
  text-align: center;
  line-height: 1.3;
}

.no-signal small {
  font-size: 0.68em;
  color: #700;
  margin-top: 0.5em;
}

/* Блок с текстом — нижняя часть */
.info-text-fixed {
  flex: 1;                        /* забирает всё остальное пространство */
  display: none;                  /* скрыт по умолчанию */
  padding: 1.4vh 1.6vw;
  overflow-y: auto;
  flex-direction: column;
  gap: 0.9em;
}
/* когда ничего не выбрано — делаем панель "пустой" визуально */
#info-panel:not(.has-selection) {
  border-color: #500;
  box-shadow: 0 0 16px rgba(80,0,0,0.2);
}

#info-panel.has-selection {
  border-color: #c00;
  box-shadow: 0 0 32px rgba(220,0,0,0.5), inset 0 0 40px rgba(160,0,0,0.2);
  animation: panel-pulse 6s ease-in-out infinite alternate;
}

@keyframes panel-pulse {
  0%   { box-shadow: 0 0 24px rgba(200,0,0,0.4), inset 0 0 30px rgba(160,0,0,0.15); }
  100% { box-shadow: 0 0 50px rgba(255,0,0,0.7), inset 0 0 55px rgba(200,0,0,0.3); }
}

/* Placeholder — только когда ничего не выбрано */
#info-placeholder {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #600;
  font-size: 1.3em;
  text-align: center;
  opacity: 0.75;
}

/* Скрываем placeholder для has-selection и preview-active, но НЕ весь panel */
#info-panel.has-selection #info-placeholder,
#info-panel.preview-active #info-placeholder {
  display: none !important;
}

.zone {
  fill: transparent;
  cursor: crosshair;
  transition: fill .25s, stroke .25s;
}
.zone.enabled:hover {
  fill: rgba(180,0,0,0.14);
  stroke: rgba(220,0,0,0.8);
  stroke-width: 2.4;
}
.zone.active {
  fill: rgba(220,0,0,0.35);
  stroke: rgba(255,60,60,0.95);
  stroke-width: 2.8;
  filter: drop-shadow(0 0 12px #f40) drop-shadow(0 0 20px #800);
}

/* типографика */
h2 {
  color: #e00;                      /* чуть более тёмный красный */
  text-shadow: none;                /* убрать glow полностью */
  font-weight: 500;                 /* не жирный */
  letter-spacing: 0.5px;            /* лёгкий разряд */
}
@keyframes title-flicker {
  0%, 92%, 94%, 96%, 100% { opacity: 1; text-shadow: 0 0 6px #f00, 0 0 12px #800; }
  93%  { opacity: 0.92; text-shadow: 1px 0 #f00, -1px 0 #00f; }
  95%  { opacity: 0.96; text-shadow: -1px 0 #f00, 1px 0 #0f0; }
}

.meta-line strong,
.meta-line {
  color: #c40;                      /* приглушённый оранжево-красный */
  text-shadow: none;
}
  
/* Описание может скроллиться, если очень длинное */
.description {
  flex: 1;
  overflow-y: auto;
  margin: 0.4em 0 0 0;
  padding-top: 0.8em;
  border-top: 1px solid #500;
  white-space: pre-wrap;
  font-size: 1.12em;
  color: #b22;
  line-height: 1.45;
}

#info-empty {
  color: #600;
  font-size: 1.3em;
  text-align: center;
  margin: auto 0;
  opacity: 0.75;
}

/* Прелоадер (обновлённый) */
#preloader {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #c00;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 1.5rem;
  text-align: center;
  transition: opacity 0.7s ease-out;
  pointer-events: none;
}

#preloader.hidden {
  opacity: 0;
  pointer-events: none;
}

#preloader .status {
  margin: 1.2em 0 0.8em;
  font-size: 1.1em;
  letter-spacing: 1px;
  text-shadow: 0 0 6px #800;
  min-height: 1.4em;
  position: relative;
  display: inline-block;
}

#preloader .progress {
  width: 380px;
  max-width: 80vw;
  height: 6px;
  background: #200;
  border: 1px solid #400;
  overflow: hidden;
  margin-top: 1.5em;
}

#preloader .bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #800, #f00, #c00);
  transition: width 0.4s ease-out;
}

.scanline {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0 3px,
    rgba(180,0,0,0.06) 3px,
    rgba(180,0,0,0.06) 6px
  );
  animation: scan 60s linear infinite;
  opacity: 0.7;
}

/* Глитч в прелоадере — мрачный, машинный */
.glitch {
  position: relative;
  display: inline-block;
  animation: glitch-mono 1.2s infinite steps(2);
}

.glitch::before,
.glitch::after {
  content: attr(data-text); /* нужно добавить data-text="текст" в HTML или JS */
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0.8;
}

.glitch::before {
  left: 2px;
  text-shadow: -2px 0 #800;
  clip: rect(0, 900px, 0, 0); /* обрезает случайные куски */
  animation: glitch-clip 3s infinite;
}

.glitch::after {
  left: -2px;
  text-shadow: 2px 0 #400;
  clip: rect(0, 900px, 0, 0);
  animation: glitch-clip 2.5s infinite reverse;
}

@keyframes glitch-mono {
  0%, 5%, 100% { transform: translate(0); }
  2%  { transform: translate(-1.5px, 0.5px); }
  4%  { transform: translate(1.5px, -0.5px); }
}

@keyframes glitch-clip {
  0%    { clip: rect(42px, 9999px, 44px, 0); }
  5%    { clip: rect(17px, 9999px, 59px, 0); }
  10%   { clip: rect(63px, 9999px, 27px, 0); }
  /* ... можно добавить больше случайных значений, но для простоты хватит */
  100%  { clip: rect(68px, 9999px, 29px, 0); }
}

/* Глобальный glitch на #app — мрачный, как сбой системы */
#app.glitch-global {
  animation: system-decay 0.7s steps(1);
  filter: brightness(0.85) contrast(1.15) sepia(0.1) hue-rotate(350deg);
}

@keyframes system-decay {
  0%   { transform: translate(0); }
  20%  { transform: translate(3px, 1px); }
  40%  { transform: translate(-4px, -2px); }
  60%  { transform: translate(2px, 3px); }
  80%  { transform: translate(-2px, -1px); }
  100% { transform: translate(0); }
}

/* Тёмный красный шум/помехи вместо радуги */
.glitch-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: 
    linear-gradient(transparent 50%, rgba(200,0,0,0.04) 50%),
    repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(80,0,0,0.15) 1px, rgba(80,0,0,0.15) 2px);
  mix-blend-mode: multiply;
  opacity: 0;
  animation: noise-pulse 8s infinite;
  z-index: 10;
}

#app.glitch-global .glitch-overlay {
  opacity: 0.6;
  animation: noise-pulse 1.2s steps(4), scanline 60s linear infinite;
}

@keyframes noise-pulse {
  0%, 100% { opacity: 0.6; }
  50%      { opacity: 0.9; }
}

.zone.locked {
  pointer-events: none;
  fill: rgba(30,0,0,0.12) !important;
  stroke: rgba(60,0,0,0.5) !important;
  cursor: not-allowed;
}

.zone.ready:not(.opened) {
  fill: rgba(80,0,0,0.18);
  stroke: rgba(100,0,0,0.6);
  animation: pulse-ready 3s infinite alternate;
}

@keyframes pulse-ready {
  0% { stroke-opacity: 0.6; }
  100% { stroke-opacity: 0.9; }
}

.lock-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.65);
  color: #800;
  font-size: 2.2em;
  text-align: center;
  z-index: 4;
  pointer-events: none;
  text-shadow: 0 0 8px #400;
}

.lock-overlay .warning {
  font-size: 1.4em;
  color: #c00;
  animation: flicker 4s infinite alternate;
}

.lock-overlay .status {
  margin-top: 0.5em;
  font-size: 0.9em;
  color: #600;
}

/* Input для пароля в info-panel */
#password-input {
  display: none;
  margin: 1em auto;
  padding: 0.5em;
  background: #200;
  border: 1px solid #600;
  color: #c00;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 1.2em;
  text-align: center;
  width: 80%;
}

#password-submit {
  background: #400;
  border: 1px solid #800;
  color: #f00;
  padding: 0.5em;
  margin-top: 0.5em;
  cursor: pointer;
}

#password-error {
  display: block !important;  /* на всякий случай */
  color: #f00;
  font-size: 0.9em;
  margin-top: 0.5em;
}

#password-input,
#password-submit {
  display: none;
}

#info-no-zones {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #600;
  font-size: 1.35em;
  text-align: center;
  line-height: 1.4;
  padding: 1em;
  opacity: 0.9;
}

#info-no-zones strong {
  color: #c00;
  font-size: 1.1em;
}

#info-no-zones small {
  margin-top: 1em;
  font-size: 0.75em;
  color: #400;
}

@keyframes flicker {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.4; }
}

@media (max-width: 1024px) and (orientation: portrait) {
  #app, #content, body, html {
    overflow: hidden !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  #map-container {
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    overflow: hidden;
    position: relative;
    background: #000;
  }

  #map-wrapper {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vh;
    height: 100vw;
    transform-origin: top left;
    transform: rotate(90deg) translateY(-100%);
    z-index: 1;
  }

  #map-wrapper svg {
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    display: block;
    object-fit: contain;
    position: relative;
    z-index: 1;
  }

  /* Скрываем всё лишнее */
  #info-panel,
  #app::before,
  #map-container::before,
  #map-container::after,
  #content > *:not(#map-container) {
    display: none !important;
  }

  /* Статичная подсветка при выборе (остаётся всегда) */
  .zone.enabled:hover {
    fill: rgba(180,0,0,0.14);
    stroke: rgba(220,0,0,0.8);
    stroke-width: 4;
  }

  .zone.active {
    fill: rgba(220,0,0,0.35);
    stroke: rgba(255,60,60,0.95);
    stroke-width: 5.5;
    filter: drop-shadow(0 0 10px #f40);
  }

  /* Пульсация для привлечения внимания в начале */
  @keyframes pulseZone {
    0%, 100% {
      fill: transparent;
      stroke: rgba(255, 60, 60, 0.7);
      stroke-width: 0;
    }
    50% {
      fill: rgba(255, 60, 60, 0.18);
      stroke: #ff4040;
      stroke-width: 3;
    }
  }

  .zone.enabled {
    animation: pulseZone 4.2s infinite ease-in-out;
  }

  /* Задержки поочерёдные */
  .zone.enabled[data-zone="1"] { animation-delay: 0s; }
  .zone.enabled[data-zone="2"] { animation-delay: 0.7s; }
  .zone.enabled[data-zone="3"] { animation-delay: 1.4s; }
  .zone.enabled[data-zone="4"] { animation-delay: 2.1s; }
  .zone.enabled[data-zone="5"] { animation-delay: 2.8s; }
  .zone.enabled[data-zone="6"] { animation-delay: 3.5s; }

  /* После первого касания — отключаем ТОЛЬКО пульсацию */
  #map-container.touched .zone.enabled {
    animation: none !important;
  }

  /* Активная зона остаётся подсвеченной даже после .touched */
  #map-container.touched .zone.active {
    fill: rgba(220,0,0,0.35) !important;
    stroke: rgba(255,60,60,0.95) !important;
    stroke-width: 5.5 !important;
    filter: drop-shadow(0 0 10px #f40) !important;
  }

  /* Модальное окно */
  .zone-modal {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    border: none;
    background: transparent;
    color: #c00;
    font-family: 'IBM Plex Mono', monospace;
  }

  .zone-modal::backdrop {
    background: rgba(0,0,0,0.85);           /* сильное затемнение фона */
    backdrop-filter: blur(4px);             /* размытие карты под попапом */
  }

  .modal-content {
    position: relative;
    width: 100%;
    height: 100%;
    background: rgba(10,0,0,0.92);
    border: 2px solid #500;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .close-btn {
    position: absolute;
    top: 12px;
    right: 16px;
    background: transparent;
    border: none;
    color: #c00;
    font-size: 2.8rem;
    font-weight: bold;
    cursor: pointer;
    padding: 0 12px;
    line-height: 1;
    z-index: 10;
  }

  .close-btn:hover,
  .close-btn:focus {
    color: #ff4040;
    text-shadow: 0 0 8px #f40;
  }

  .modal-image {
    flex: 0 0 40%;                        /* или 35-45% под твои картинки */
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-image img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border: 1px solid #600;
    box-shadow: 0 0 16px rgba(200,0,0,0.3);
  }

  .modal-text {
    flex: 1;
    padding: 20px 24px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .modal-text h2 {
    margin: 0 0 12px;
    font-size: 1.8rem;
    color: #e00;
  }

  .meta {
    margin: 8px 0;
    font-size: 1.1rem;
    color: #c40;
  }

  .modal-text p {
    margin: 16px 0 0;
    line-height: 1.5;
    font-size: 1.05rem;
    color: #b22;
    white-space: pre-wrap;
  }

  .zone-modal[open] .modal-content {
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
  }

  .close-btn {
    outline: none;                    /* убираем стандартный outline */
    box-shadow: none;                 /* на случай, если браузер использует shadow вместо outline */
  }

  /* Для клавиатурной навигации оставляем видимый фокус (accessibility) */
  .close-btn:focus-visible {
    outline: 2px solid #ff4040;       /* красный контур только при tab/стрелках */
    outline-offset: 2px;
  }

  /* Если хочешь полностью убрать фокус даже для клавиатуры (не рекомендуется, но если настаиваешь) */
  .close-btn:focus {
    outline: none;
    box-shadow: none;
  }
}

/* Для мобильного попапа */
.modal-password {
  display: none;
  flex-direction: column;
  align-items: center;
  margin-top: 1em;
}

.modal-password input {
  background: #200;
  border: 1px solid #600;
  color: #c00;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 1.2em;
  text-align: center;
  width: 80%;
  padding: 0.5em;
}

.modal-password button {
  background: #400;
  border: 1px solid #800;
  color: #f00;
  padding: 0.5em 1em;
  margin-top: 0.5em;
}

.modal-password .error {
  display: block !important;  /* на всякий случай */
  color: #f00;
  font-size: 0.9em;
  margin-top: 0.5em;
}

/* Для мобильного — тоже по умолчанию скрыто */
.modal-password {
  display: none !important;
}
  
/* Опционально: ландшафт на мобильных — без поворота, карта на весь экран */
@media (max-width: 1024px) and (orientation: landscape) {
  #map-container {
    width: 100%;
    height: 100%;
  }

  #map-wrapper {
    transform: none;
  }

  #map-wrapper svg {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  /* Пока тоже скрываем инфо-панель, если нужно */
  #info-panel {
    display: none;
  }
}
  
</style>
</head>
<body>

<div id="preloader">
  <div class="scanline"></div>
  <div>ИНИЦИАЛИЗАЦИЯ СИГНАЛА...</div>
<div class="status glitch" id="preload-status" data-text="Поиск носителя данных">Поиск носителя данных</div>

// Глобальные переменные

  }

  const imageEl = document.querySelector('#map-wrapper image');

  if (openedZones.length === 0 && !activeZone && !passwordInputVisible && readyStage === 0) {

    document.getElementById('info-text-fixed').style.display = 'none';
    noZonesEl.style.display = 'flex';
    return;
  }

  noZonesEl.style.display = 'none';

  // 3. Обычное состояние: когда НИЧЕГО не выбрано и НЕ показывается ввод пароля
  if (!activeZone && !passwordInputVisible) {
    placeholder.style.display = 'flex';
    document.getElementById('info-image-fixed').style.display = 'none';
    document.getElementById('info-text-fixed').style.display = 'none';
  } else {
    // Если что-то выбрано или ввод пароля виден — placeholder прячем
    placeholder.style.display = 'none';
  }
}

    image: "assets/info/image_6.png"
  }
};


// Функции typeText, showInfo, clearInfo (без изменений)
function typeText(el, text) {
  el.textContent = "";
  let i = 0;
  clearInterval(typingTimer);
  typingTimer = setInterval(() => {
    if (i < text.length) {
      el.textContent += text[i++];
    } else {
      clearInterval(typingTimer);
      typingTimer = null;
    }
  }, 38);
}

function showInfo(zoneId, isHover = false) {
  hidePasswordPrompts();
  
  const d = data[zoneId];
  if (!d) return;
  document.getElementById('i-title').textContent = d.title;
  document.getElementById('i-class').textContent = d.class;
  document.getElementById('i-status').textContent = d.status;
  document.getElementById('i-desc').textContent = '';
  typeText(document.getElementById('i-desc'), d.desc);
  const imageBlock = document.getElementById('info-image-fixed');
  imageBlock.innerHTML = '';
  const img = document.createElement('img');
  img.src = d.image || 'assets/info/placeholder.png';
  img.alt = d.title;
  img.style.width = '100%';
  img.style.height = '100%';
  img.style.objectFit = 'cover';
  img.style.border = '2px solid #600';
  imageBlock.appendChild(img);
  document.getElementById('info-placeholder').style.display = 'none';
  document.getElementById('info-image-fixed').style.display = 'flex';
  document.getElementById('info-text-fixed').style.display = 'flex';
  if (isHover) {
    document.getElementById('info-panel').classList.add('preview-active');
  } else {
    document.getElementById('info-panel').classList.add('has-selection');
  }
}

function clearInfo(isHover = false) {
  clearInterval(typingTimer);
  typingTimer = null;
  document.getElementById('i-title').textContent = '';
  document.getElementById('i-class').textContent = '';
  document.getElementById('i-status').textContent = '';
  document.getElementById('i-desc').textContent = '';
  const imageBlock = document.getElementById('info-image-fixed');
  imageBlock.innerHTML = `
    <div class="no-signal">
      NO SIGNAL
      <small>Изображение зоны<br>будет здесь</small>
    </div>
  `;
  document.getElementById('info-image-fixed').style.display = 'none';
  document.getElementById('info-text-fixed').style.display = 'none';
  document.getElementById('info-placeholder').style.display = 'flex';
  if (isHover) {
    document.getElementById('info-panel').classList.remove('preview-active');
  } else {
    document.getElementById('info-panel').classList.remove('has-selection');
    activeZone?.classList.remove('active');
    activeZone = null;
  }
  if (!activeZone) {
    document.getElementById('info-placeholder').style.display = 'flex';
    document.getElementById('info-image-fixed').style.display = 'none';
    document.getElementById('info-text-fixed').style.display = 'none';
  }

  hidePasswordPrompts();
  updateNoZonesPlaceholder();  // ← уже есть, но для надёжности
}

// Обработка зон
document.querySelectorAll('.zone').forEach(z => {
  const zoneNum = +z.dataset.zone;

  // Классы зон в зависимости от состояния
  if (zoneNum > readyStage) {
    z.classList.add('locked');
  } else if (openedZones.includes(zoneNum)) {
    z.classList.add('enabled', 'opened');
  } else {
    z.classList.add('ready');
  }

z.addEventListener('click', () => {
  if (openedZones.length === 0 && !z.classList.contains('ready')) {
    return;
  }
  
  if (z.classList.contains('locked')) return;

  const zoneNum = +z.dataset.zone;

  // Повторный клик по активной зоне → снимаем всё
  if (activeZone === z) {
    activeZone.classList.remove('active');
    activeZone = null;
    clearInfo(false);
    hidePasswordPrompts();
    updateNoZonesPlaceholder();  // ← добавь здесь
    return;
  }

  // Снимаем выделение с предыдущей зоны
  if (activeZone) {
    activeZone.classList.remove('active');
    clearInfo(false);
  }

  // Устанавливаем новую зону активной (визуально)
  activeZone = z;
  z.classList.add('active');

  if (openedZones.includes(zoneNum)) {
    // Уже открыта → показываем инфо
    showInfo(zoneNum, false);
  } else if (z.classList.contains('ready')) {
    // Готова по дате → проверяем последовательность
    if (isPreviousZonesOpened(zoneNum)) {
      // Можно активировать → показываем ввод ключа
      showPasswordPrompt(zoneNum);
    } else {
      // Заблокирована последовательностью → показываем сообщение
      showSequentialLockMessage(zoneNum);
    }
  }
});

  // Hover (только для уже открытых зон)
  z.addEventListener('mouseenter', () => {
    if (activeZone || !z.classList.contains('enabled')) return;
    showInfo(zoneNum, true);
  });

  z.addEventListener('mouseleave', () => {
    if (activeZone || !z.classList.contains('enabled')) return;
    clearInfo(true);
  });
});

// Показ ввода пароля (ПК — в info-panel, мобильный — в модальном окне)
function showPasswordPrompt(zoneNum) {
  const isMobilePortrait = window.matchMedia("(max-width: 1024px) and (orientation: portrait)").matches;

  if (isMobilePortrait) {
    const modal = document.getElementById('zone-modal');
    const modalText = document.querySelector('.modal-text');
    modalText.innerHTML = `
      <h2>АКТИВАЦИЯ ЗОНЫ ${zoneNum}</h2>
      <p>ВВЕДИТЕ КЛЮЧ</p>
    `;
    const modalPassword = document.querySelector('.modal-password') || document.createElement('div');
    modalPassword.className = 'modal-password';
    modalPassword.innerHTML = `
      <input type="text" id="modal-password-input" placeholder="КЛЮЧ (6 символов)" maxlength="6">
      <button id="modal-password-submit">АКТИВИРОВАТЬ</button>
      <div class="error" id="modal-password-error"></div>
    `;
    modalText.appendChild(modalPassword);
    modalPassword.style.display = 'flex';
    document.getElementById('modal-password-input').value = '';
    document.getElementById('modal-password-error').textContent = '';
    modal.showModal();

    document.getElementById('modal-password-submit').onclick = () => {
      const input = document.getElementById('modal-password-input').value.trim().toUpperCase();
      const errorEl = document.getElementById('modal-password-error');
  
      if (input === passwords[zoneNum - 1]) {
        errorEl.textContent = '';
        openZone(zoneNum);
      // modal.close(); — если нужно закрыть сразу
      } else {
        errorEl.textContent = 'НЕВЕРНЫЙ КЛЮЧ';
        errorEl.style.animation = 'flicker 1.2s infinite alternate';
        setTimeout(() => { errorEl.style.animation = ''; }, 3000);
      }
    };
  } else {
    // ПК: показываем поле в info-панели
    document.getElementById('info-placeholder').style.display = 'none';
    document.getElementById('info-image-fixed').style.display = 'none';
    document.getElementById('info-text-fixed').style.display = 'none';
    const input = document.getElementById('password-input');
    input.style.display = 'block';
    document.getElementById('password-submit').style.display = 'block';
    document.getElementById('password-error').textContent = '';
    input.value = '';
    input.placeholder = `КЛЮЧ ДЛЯ ЗОНЫ ${zoneNum}`;
    input.focus();

    document.getElementById('password-submit').onclick = () => {
      const val = document.getElementById('password-input').value.trim().toUpperCase();
      const errorEl = document.getElementById('password-error');
  
      if (val === passwords[zoneNum - 1]) {
        errorEl.textContent = '';           // очищаем ошибку при успехе
        openZone(zoneNum);
      } else {
        errorEl.textContent = 'НЕВЕРНЫЙ КЛЮЧ. ПОВТОРИТЕ.';
        // Можно добавить визуальный акцент
        errorEl.style.animation = 'flicker 1.2s infinite alternate';
        setTimeout(() => { errorEl.style.animation = ''; }, 3000);
      }
    };
  }
  updateNoZonesPlaceholder();
}

function hidePasswordPrompts() {
  // ПК-версия
  document.getElementById('password-input').style.display = 'none';
  document.getElementById('password-submit').style.display = 'none';
  document.getElementById('password-error').textContent = '';

  // Мобильная версия
  document.querySelectorAll('.modal-password').forEach(el => {
    el.style.display = 'none';
  });

  // Возвращаем placeholder, если ничего не выбрано
  if (!activeZone) {
    document.getElementById('info-placeholder').style.display = 'flex';
    document.getElementById('info-image-fixed').style.display = 'none';
    document.getElementById('info-text-fixed').style.display = 'none';
  }
  updateNoZonesPlaceholder();  // ← добавь
}

// Функция открытия зоны
function openZone(zoneNum) {
  if (openedZones.includes(zoneNum)) return;

  openedZones.push(zoneNum);
  openedZones.sort((a, b) => a - b);
  localStorage.setItem('openedZones', JSON.stringify(openedZones));

  const z = document.querySelector(`.zone[data-zone="${zoneNum}"]`);
  if (z) {
    z.classList.remove('ready');
    z.classList.add('enabled', 'opened');
  }

  // Скрываем ввод пароля
  document.getElementById('password-input').style.display = 'none';
  document.getElementById('password-submit').style.display = 'none';
  document.querySelectorAll('.modal-password').forEach(el => el.style.display = 'none');

  hidePasswordPrompts();   // ← добавь
  updateMap();
  updateNoZonesPlaceholder();  // ← добавь сюда
  showInfo(zoneNum, false); // сразу показываем информацию о секторе
}

// Проверяет, открыты ли все зоны до указанной (zoneNum - 1)
function isPreviousZonesOpened(zoneNum) {
  if (zoneNum <= 1) return true; // Первая зона всегда доступна
  
  for (let i = 1; i < zoneNum; i++) {
    if (!openedZones.includes(i)) {
      return false;
    }
  }
  return true;
}

function showSequentialLockMessage(zoneNum) {
  // Полностью очищаем панель перед показом сообщения
  hidePasswordPrompts();
  document.getElementById('info-image-fixed').style.display = 'none';
  document.getElementById('info-text-fixed').style.display = 'none';
  document.getElementById('info-placeholder').style.display = 'none';

  // Показываем сообщение
  const placeholder = document.getElementById('info-placeholder');
  placeholder.style.display = 'flex';
  placeholder.innerHTML = `
    <div style="color: #800; font-size: 1.3em; line-height: 1.4; text-align: center; padding: 1.5em;">
      ЗОНА ${zoneNum} НЕДОСТУПНА<br>
      ТРЕБУЕТСЯ ПОСЛЕДОВАТЕЛЬНАЯ АКТИВАЦИЯ<br><br>
      <small style="color: #600; font-size: 0.85em;">
        Откройте все предыдущие зоны
      </small>
    </div>
  `;

  // На мобильном — модалка
  const isMobile = window.matchMedia("(max-width: 1024px) and (orientation: portrait)").matches;
  if (isMobile) {
    const modal = document.getElementById('zone-modal');
    if (modal) {
      const modalText = document.querySelector('.modal-text');
      modalText.innerHTML = `
        <h2>ЗОНА ${zoneNum} ЗАБЛОКИРОВАНА</h2>
        <p style="color: #c00; text-align: center; margin: 1em 0;">
          Требуется последовательная активация предыдущих зон
        </p>
      `;
      modal.showModal();
    }
  }

  updateNoZonesPlaceholder(); // обновляем состояние заглушки
}

// Обработка мобильного модального окна (твоя старая логика + интеграция)
document.addEventListener('DOMContentLoaded', () => {
  const mapImage = document.querySelector('#map-wrapper image');
  if (window.matchMedia("(max-width: 1024px) and (orientation: portrait)").matches) {
    mapImage.setAttribute('href', 'assets/maps/open_0_6_v2.png'); // начальная для мобильного
    // ... остальная логика модального окна, если нужно
  }

  // Закрытие модального окна
  document.querySelector('.close-btn')?.addEventListener('click', () => {
    document.getElementById('zone-modal').close();
  });

  document.getElementById('zone-modal')?.addEventListener('click', e => {
    if (e.target === document.getElementById('zone-modal')) {
      document.getElementById('zone-modal').close();
    }
  });

  document.getElementById('zone-modal')?.addEventListener('close', () => {
    hidePasswordPrompts();
  });
});

// Прелоадер и глитчи (твоя последняя версия, без изменений)
document.addEventListener('DOMContentLoaded', () => {
  const preloader = document.getElementById('preloader');
  if (!preloader) return;

  const statusEl = document.getElementById('preload-status');
  const bar = document.getElementById('preload-bar');
  const minDuration = 5000;
  const startTime = Date.now();

  const messages = ["Поиск носителя данных...", "Обнаружен фрагмент карты сектора", "Проверка целостности слоёв...", "Калибровка координат зон...", "Синхронизация сигнатуры...", "Соединение установлено"];
  const delays = [800, 1200, 600, 1000, 500, 900];
  let msgIndex = 0;

  function nextMessage() {
    if (msgIndex < messages.length) {
      let msg = messages[msgIndex];
      if (Math.random() < 0.3) msg = msg.slice(0, -3) + msg.slice(-3).repeat(2) + '...';
      statusEl.textContent = msg;
      const progress = ((msgIndex + 1) / messages.length) * 100;
      bar.style.width = `${progress}%`;
      msgIndex++;
      setTimeout(nextMessage, delays[msgIndex - 1] || 700);
    }
  }
  nextMessage();

  function tryHide() {
    const elapsed = Date.now() - startTime;
    if (elapsed >= minDuration && msgIndex >= messages.length) {
      preloader.classList.add('hidden');
      setTimeout(() => {
        preloader.remove();
        startGlobalGlitches();
      }, 800);
    } else {
      setTimeout(tryHide, 200);
    }
  }

  const mainMapImage = document.querySelector('#map-wrapper image');
  if (mainMapImage?.complete && mainMapImage.naturalWidth > 0) {
    tryHide();
  } else if (mainMapImage) {
    mainMapImage.addEventListener('load', tryHide, { once: true });
    mainMapImage.addEventListener('error', tryHide, { once: true });
  } else {
    setTimeout(tryHide, minDuration);
  }

  setTimeout(() => preloader?.parentNode && preloader.remove(), 15000);
});

function startGlobalGlitches() {
  const app = document.getElementById('app');
  function triggerGlitch() {
    app.classList.add('glitch-global');
    setTimeout(() => app.classList.remove('glitch-global'), 700 + Math.random() * 500);
    if (Math.random() < 0.15) {
      app.style.filter = 'brightness(0.4) contrast(1.8)';
      setTimeout(() => app.style.filter = '', 400);
    }
    setTimeout(triggerGlitch, 12000 + Math.random() * 23000);
  }
  setTimeout(triggerGlitch, 5000 + Math.random() * 10000);
}
</script>
